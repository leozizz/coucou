name: Windows Pack

# Builds and packs the Tauri desktop app from windows/ and publishes the
# generated installers as downloadable workflow artifacts.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - '.github/workflows/windows-pack.yml'
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/windows-pack.yml'

permissions:
  contents: read

jobs:
  pack:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json

      # Ensure a C/C++ compiler toolchain is available for native crates.
      - name: Setup MSVC build tools
        uses: ilammy/msvc-dev-cmd@v1

      # Explicitly bootstrap Rust using rustup for reproducible packaging.
      - name: Setup Rust (rustup)
        shell: pwsh
        run: |
          rustup set profile minimal
          rustup default stable
          rustup update stable
          rustup component add rustfmt clippy

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows/target
          key: windows-pack-cargo-${{ hashFiles('windows/Cargo.lock') }}
          restore-keys: windows-pack-cargo-

      - name: Install dependencies
        run: npm ci

      - name: Build and pack
        shell: pwsh
        run: npm run pack

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Coucou-Windows-pack
          path: |
            windows/release/*.exe
            windows/release/*.msi
          if-no-files-found: error
          retention-days: 7
